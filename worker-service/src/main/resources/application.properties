spring.application.name=worker-service
# --- SERVER ---
server.port=8081

# --- DATASOURCE ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jobdb}
spring.datasource.username=${DB_USER:jobuser}
spring.datasource.password=${DB_PASSWORD:jobpass}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / HIBERNATE ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- REDIS ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# --- ACTUATOR ---
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.metrics.export.prometheus.enabled=true

# --- WORKER CONFIGURATION ---
# Redis Stream configuration
worker.stream.key=tasks_stream
worker.consumer.group=worker-group
worker.consumer.name=
worker.poll.timeout-seconds=2
worker.error.sleep-ms=1000

# Virtual Thread configuration (Java 21+)
# Maximum concurrent tasks processed simultaneously
# Adjust based on your downstream system capacity (DB, orchestrator API, etc.)
worker.virtual-threads.max-concurrent=1000

# Orchestrator callback configuration
orchestrator.callback.url=http://localhost:8080/api/workflows/task/callback
orchestrator.callback.retries=3
orchestrator.callback.retry-delay-ms=1000

# Executor configuration
executor.shell.enabled=true
