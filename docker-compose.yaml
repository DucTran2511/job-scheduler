version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: job_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: jobuser
      POSTGRES_PASSWORD: jobpass
      POSTGRES_DB: jobdb
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: job_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata:


